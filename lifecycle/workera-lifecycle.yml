  policy_published: false
  note: >-
    Two major versions are served side by side and documented in one OpenAPI. Scores and self-ratings
    are v2; capabilities (domains), competency models, programs, benchmarks, ping and audit events are
    v1. The docs state v2 "use the same authentication, rate limiting, pagination, and error handling
    as the rest of the API." No written versioning policy, support window or version-negotiation header
    is published.
