    replacement: assessment_completed webhook event
    statement: >-
      The docs describe `assessment_completed` as "the v2 replacement for `score_updated`, using a flat
      payload structure with topic-level skill ratings and behaviors."
    retirement_date: not_published
    note: >-
      Both events remain documented and configurable. This is the only supersession Workera names, and
      it carries no sunset date, so integrators cannot plan a migration from published material.
  gap: >-
