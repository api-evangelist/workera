apis:
- name: Workera API
  description: >-
    First-party REST API for the Workera skills-intelligence platform. Read-oriented, task-shaped
    endpoints expose capabilities (domains) and their competency models, programs, v2 capability scores
    and self-ratings, enterprise and per-capability benchmarks, and a SIEM-compatible audit-event feed.
    Bearer API keys are issued per company by a Workera CSM and can be restricted by scope. Cursor
    pagination (limit / next_page_after / order), x-ratelimit-* response headers and a machine-readable
    code/message/type error envelope are documented across the whole surface, alongside an HMAC-SHA256
    signed webhook catalog covering assessment and program lifecycle events.
  humanURL: https://skills.workera.ai/api/docs
  baseURL: https://skills.workera.ai/api/v1
