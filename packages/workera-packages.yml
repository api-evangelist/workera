assessment: >-
  Workera ships no client SDK in any language. Integration is raw HTTPS with a bearer key. No `SDKs`
  pointer is emitted in apis.yml because there is no SDK to point at — recording an honest zero rather
  than crediting a package that does not exist. For an enterprise API whose consumers are HR and
  security engineering teams, even one maintained client would materially lower the integration cost;
  as it stands there is also no abandonment signal to read, because there is nothing published to go
