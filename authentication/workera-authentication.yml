  scheme: bearer
  applied: global
  location: header
  header: authorization
  value_format: 'Bearer YOUR_KEY'
  example: >-
    curl -H "Content-Type: application/json" -H "authorization: Bearer YOUR_KEY"
    https://skills.workera.ai/api/v1/ping
