domain_standard:
  regime: education
  candidates_checked:
  - scim
  - lti
  - oneroster
  - ed-fi
  - caliper
  - qti
  - oai-pmh
  - shibboleth
  - saml
  - orcid
  - datacite
  - crossref
  - open-badges
  declared: none
  detail: >-
    No education or HR-tech domain standard is declared anywhere in the Workera contract. There is no
    SCIM schema URN, no LTI launch or OneRoster/Ed-Fi/Caliper/QTI shape, no xAPI or Open Badges
    assertion, and no HR Open Standards message type. The skill model is Workera's own proprietary
    ontology (capability -> skill area -> skill -> behavior, scored 0-300 with a four-band proficiency
    label), which is exactly the thing a standard would make portable. Two adjacencies exist and
    neither is a conformance:
      * Program.badge_template_id carries a Credly badge template ID. Credly issues Open Badges, but
        Workera's contract exposes only the vendor identifier, not an Open Badges assertion, so a
        consumer cannot read a badge from the Workera API.
      * HRIS and ATS synchronisation (Workday, SAP SuccessFactors, Oracle HCM, Greenhouse) is brokered
        through Kombo (connect.kombo.dev, present in the application CSP), a third-party unified HR API
        — a bilateral connector layer, which is the alternative to a standard, not an instance of one.
    Probed and not found: /scim/v2/ServiceProviderConfig (404), /scim/v2/Users (404),
    /saml/metadata (404). A 401 under the /api/v1/ prefix is the prefix-wide auth gate, not evidence of
    an endpoint, and is not counted as a hit.
  reward_only_note: >-
    This is recorded as an honest absence. The education regime's standards are built for institutions
    and courseware; enterprise skills-verification has no settled interchange standard, so nothing is
    invented to fill the slot.
gaps:
- No AsyncAPI, no api-catalog, no security.txt, no agent card.
- No enumerated error-code registry.
- No published rate-limit numbers.
- No domain standard, so every score export is a bespoke integration.
