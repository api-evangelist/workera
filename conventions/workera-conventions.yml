  exhaustion_status: 429
  detail: rate-limits/workera-rate-limits.yml
idempotency:
  coverage: na
  mechanism: none
  scope: []
  note: >-
    The public REST surface has no mutating operations to protect. Fourteen of fifteen documented
    operations are GET; the single POST (POST /api/v1/benchmarks,
    operationId WorkeraWebappsWeb.Rest.Controllers.BenchmarkController.enterprise) is a query-shaped
    request that accepts a `domain_identifiers` filter body and returns aggregate benchmark data — it
    creates nothing and has no side effect to replay. No Idempotency-Key header is documented, and none
    is needed for this surface. Idempotency is therefore not-applicable rather than absent.
  inbound_webhooks:
    consumer_guidance: >-
      Workera does document idempotency for the OTHER direction: webhook consumers are told to use the
      payload `identifier` field to avoid processing the same score update twice, and delivery retries
      (immediate, 1m, 5m, 15m, 1h, then stop after 5 failures) make duplicate delivery expected. This
      is a requirement Workera places on the integrator, not a guarantee Workera offers on writes.
    source: https://skills.workera.ai/api/docs
dry_run_mode:
  supported: na
  note: Read-only public surface; there is no destructive action to rehearse.
reversibility:
  applicable: na
  grade: na
  write_surface: none
  note: >-
    The published Workera API exposes no create, update or delete operations, so there is nothing to
    reverse. Fourteen GETs plus one query-shaped POST that returns aggregate benchmarks. Reversibility
    is not-applicable, not absent — an agent calling this API cannot take an action that would need to
    be taken back. The one state change adjacent to the API is a scoring appeal, which is resolved by
    a human reviewer inside the Workera product and surfaced to integrators only as the read-only
    `appeal_approved` webhook; it is not an API-callable operation and no reversal window is published.
  reversal_operations: []
