api: Workera API
style:
  protocol: REST over HTTPS
  encoding: JSON
  urls: task-oriented
  statement: >-
    "The Workera API is organized around REST. Our API has task-oriented URLs, returns JSON-encoded
    responses, and uses standard HTTP response codes, authentication, and verbs."
  string_encoding: >-
    Free-text fields are HTML-escaped at storage and decoded exactly once at the response boundary, so
    a value stored as `Bob&#39;s Skill` is returned as `Bob's Skill`. Decoding is single-pass: a value
    that legitimately contains literal entity text (`&amp;amp;`) is decoded exactly once (to `&amp;`).
authentication:
  style: bearer API key in the `authorization` header
  detail: authentication/workera-authentication.yml
versioning:
  style: URI path segment
  versions:
  - v1
  - v2
  base_urls:
  - https://skills.workera.ai/api/v1/
  - https://skills.workera.ai/api/v2/
  note: >-
    v1 and v2 coexist on the same host and share authentication, rate limiting, pagination and error
    handling. Scores and self-ratings moved to v2; capabilities (domains), programs, benchmarks, ping
    and audit events remain on v1. No sunset date is published for v1.
pagination:
  style: cursor
  parameters:
  - name: limit
    in: query
    required: false
    default: 10
    maximum: 100
    note: The audit-events endpoint documents a default of 50 and a maximum of 100.
  - name: next_page_after
    in: query
    required: false
    note: >-
      Cursor start position. Must be in the same format as the field the sort is happening on (for
      audit events, an ISO 8601 datetime).
  - name: order
    in: query
    required: false
    values:
    - asc
    - desc
    default: desc
  response_fields:
  - name: has_more
    meaning: whether more objects can be obtained
  - name: next_page
    meaning: absolute URL of the next page
  - name: data
    meaning: the page of results
filtering:
